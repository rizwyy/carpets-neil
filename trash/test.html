                  '<p>Solutions to make the selection and installation of your carpets as simple as possible.&nbsp;&nbsp;</p>\n<p>Order <a href="/useful-links/samples/">free carpet samples</a></p>\n<p>Book your <a href="/online-appointments/">free home consultation &amp; measuring</a></p>\n<p>Approved <a href="/service/fitting/">fitting arrangement service</a>&nbsp;</p>\n<p>Find out more about the&nbsp;<a href="/service/uplift-and-disposal/">uplift and disposal service</a></p>',
                column3Header: "Expert carpet advice",
                column3Text:
                  '<p>How to <a href="/advice/planning-guides/how-to-measure-a-room/">measure your room</a> for carpet</p>\n<p>Read our helpful <a href="/carpets/carpet-buying-guide/">carpet buying guide</a></p>\n<p>How to maintain and <a href="/carpets/carpet-care-guide/">care for your carpet</a></p>\n<p>Top tips on <a href="/carpets/how-to-fit-carpet/">how to fit a carpet</a>&nbsp;</p>\n<p>View our <a href="/inspiration/home-transformation/">top inspirational carpet ideas and colour trends</a></p>',
                fullWidthBlockHeader: "Carpet Ranges",
                fullWidthBlockDescription:
                  "<p>Find your perfect carpet at the UKs leading carpet and flooring retailer, Carpetright. We have quality carpets to suit every room, interior style and budget. Check out our <a href='https://www.carpetright.co.uk/advice/planning-guides/budget-planning/'>budget planning guide</a>.</p> Discover soft lounge carpets, cosy bedroom carpets, dependable stair carpets and more online. There is a huge selection to choose from including Saxony carpets and Twist carpets.</p><p>Read on to find out more on our carpet ranges, or for help with finding the best carpet for you, take a look at our <a href='https://www.carpetright.co.uk/carpets/carpet-buying-guide/'>carpet buying guide</a>.</p><br /><br /><h3>Carpet colours</h3><p>Colour is an important factor when buying a carpet, as it can change the feel of the room immensely. Because of this, we offer various carpet colours from neutrals, lights, darks, and bolder colours. So, whether you are looking for a lighter colour to blend in to suit any interior design, or a bolder colour to make your carpet stand out to be a centrepiece, we have got it all.</p><p>If you are unsure what carpet colour you want, or you are not sure how to style your room around the carpet, check out our <a href='https://www.carpetright.co.uk/carpets/carpet-buying-guide/carpet-colour-ideas/'>carpet colour guide</a>.</p><br /><br /><h3>Carpet by room</h3><p> While you can buy the same carpet for every room in your home, different types suit different spaces. For example, you can choose a soft and warming <a href='https://www.carpetright.co.uk/carpets/room/living-room/'>living room carpet</a> or <a href='<a href='https://www.carpetright.co.uk/carpets/room/bedroom/'>bedroom carpet</a> to make these rooms incredibly inviting. For these rooms the type of carpet you want is often high in comfort. </p><p>For <a href='https://www.carpetright.co.uk/carpets/room/dining-room/'>dining room carpets</a> and <a href='https://www.carpetright.co.uk/carpets/room/hall-stairs-landing/'>Hallway, stairs, or landing carpets</a> you would want a more durable and hard-wearing carpet. Since these areas of the house are high footfall areas, our carpets for these rooms are designed with combining style and practicality.</p><p>If you're looking for a <a href='https://www.carpetright.co.uk/carpets/room/bathroom/'>bathroom carpet</a> or a <a href='https://www.carpetright.co.uk/carpets/room/kitchen/'>kitchen carpet</a> then the most important factor is having a carpet that's hardwearing, stain resistant, and waterproof. Our carpets for the bathrooms and kitchens offer a stylish but practical look, offering those key factors.</p><p> Want more information? Why not take a look at our helpful guide to the <a href='https://www.carpetright.co.uk/carpets/carpet-buying-guide/best-carpet-for-rooms/'>Best Carpet for Rooms</a> to get some helpful tips.</p><br /><br /><h3>Carpet types</h3><p>Here at Carpetright, we know that carpets vary by more than just colour. The type of carpet makes just as much of a difference. A brief overview of our carpet types is below, but for more detail, take a look at our handy <a href='https://www.carpetright.co.uk/carpets/carpet-buying-guide/choose-right-carpet-type/'>Carpet Type Guide</a>.<p><p>These are:</p> <br /><h4>Twist carpets</h4><p><a href='https://www.carpetright.co.uk/carpets/design/plain-smooth-durable/'>Twist carpets</a> are the most popular type of carpets. They offer the best of both worlds with being both smooth and durable, and come in various colours and styles. This type of carpet is made from fibres of yarn that has been tightly twisted together, giving the carpet a textured appearance.</p><br /><h4>Saxony carpets</h4><p><a href='https://www.carpetright.co.uk/carpets/design/plain-luxurious-deep/'>Saxony carpets</a> are also heard wearing but offer a deeper and more luxurious underfoot feeling. This type of carpet is made up of twisted carpet fibres that stand up straight and sheared, making an even surface, and is available in a range of colours.</p><br /><h4>Loop pile carpets</h4><p><a href='https://www.carpetright.co.uk/carpets/design/loop-pile/'>Loop pile carpets</a> are both cosy and practical. They are made from uncut continuous loops and give a contemporary look with its knot appearance. These types of carpets are easier to clean and maintain and come in a range of styles.</p><br /><h4>Berber carpets</h4><p><a href='https://www.carpetright.co.uk/carpets/design/berber/'>Berber carpets</a> offer the benefit of being hardwearing and more affordable, so if you're looking for a cheap carpet, this is the one for you. These carpets are woven with an uncut loop pile that attaches to the backing and is usually lighter in colour with slight darker flecks throughout.</p><br /><h4>Cut and loop carpets</h4><p><a href='https://www.carpetright.co.uk/carpets/design/cut-and-loop/'>Cut and loop carpets</a>  are both durable and practical, offering a soft and family-friendly option. These carpets have a combination of looped and cut fibres, as the same suggests, in a variety of patterns. They are great in any high footfall area and can bring style with any colour or pattern.</p><br /><h4>Velvet carpets</h4><p><a href='https://www.carpetright.co.uk/carpets/design/velvet/'>Velvet carpets</a>  are made with straighter yarns with cut ends giving it a soft and velvety surface. These are less hardwearing but offer a smoother, more sophisticated, and luxurious level of comfort and softness.</p><br /><br /><h3>Carpet materials</h3><p>All of our carpets are available in different materials which also all reap different benefits depending on the type of carpet you are after. From man-made synthetic carpets to natural carpets, or even a blend of the two, we've got it all. To learn about the different materials and which is best take a look at our <a href='https://www.carpetright.co.uk/carpets/carpet-buying-guide/best-carpet-material/'>carpet materials guide</a> or read on for a brief overview.</p><br /><h4>Polypropylene carpet</h4><p><a href='https://www.carpetright.co.uk/carpets/made-from/100-polypropylene/'>Polypropylene carpets</a> are a synthetic material but these are soft, yet stain-resistant carpets and they are easy to clean. These carpets are great for high traffic areas, for pet owners, or for kitchens.</p><br /><h4>Polyamide carpet</h4><p><a href='https://www.carpetright.co.uk/carpets/made-from/100-polyamide/'>Polyamide carpets</a>, also known as nylon carpets, are easy also man-made and are durable and easy to clean. These fibres bounce back so your carpet will last longer. Long-lasting and soft, these carpets look good in any room.<p> <br /><h4>Wool carpet</h4><p><a href='https://www.carpetright.co.uk/carpets/made-from/100-wool/'>Wool carpets</a> are a classic choice. These are naturally made, more sustainable, and good looking. Offering benefits such as being durable, soft to the touch, easy to clean, and more. The unique property of this carpet means colour looks richer, they hold heat, act as a flame retardant, and insulate sound better.<p><br /><h4>Sisal carpet</h4><p><a href='https://www.carpetright.co.uk/carpets/made-from/100-sisal/'>Sisal carpets</a> are also naturally made and offer benefits such as being tough and comfortable. These carpets are hardwearing, but also are the height of luxury. With their traditional weave texture, they give an almost organic appearance.</p><br /><br /><h3>Carpet styles</h3><p>Alongside type and colour, you can also choose from a range of carpet styles and designs. You can choose from plain carpets in any colour, or make a statement with patterned, striped, or textured carpets.</p><p>With a <a href='https://www.carpetright.co.uk/carpets/design/patterned/'>patterned carpet</a> you can make a statement or embrace tradition in any room. From classic motifs with ornate detailing to on-trend styles, and colours ranging from big and bold to neutral tones.</p><p>Choosing a <a href='https://www.carpetright.co.uk/carpets/design/striped/'>striped carpets</a> can make a statement in any room as they are vibrant and striking and can also help to create the illusion of extra space. Perfect for stairs or any room of the house.</p><p><a href='https://www.carpetright.co.uk/carpets/design/textured/'>Textured carpets</a> can revitalise your home and create a sophisticated look. These carpets are soft and hardwearing, but also give a unique look and feel to the room when walking around. Available in a range of colours and materials.</p><br /><br /><h3>Carpet accessories</h3><p>As well as carpets, we also offer various <a href='https://www.carpetright.co.uk/accessories/'>accessories</a> for your carpet or flooring. These include the likes of carpet grippers, single and double edge door bars, cover door bars, stair rods and more. For more information check out our <a href='https://www.carpetright.co.uk/accessories/flooring-accessories-buying-guide/'>flooring accessories buying guide</a>.</p><p>A great addition to have is <a href='https://www.carpetright.co.uk/underlay/'>carpet underlay</a> as this improves the comfort and durability of your carpet flooring. For more information, we've got a handy <a href='https://www.carpetright.co.uk/underlay/underlay-buying-guide/'>underlay buying guide</a>.</p><br /><br /><h3>Carpet Services</h3><p>Once you know which carpet you may want, our friendly team can help you. You can <a href='https://www.carpetright.co.uk/online-appointments/'>book a free consultation</a> which involves an in-home or online meeting to measure, talk through ranges, or offer top tips. We also offer a <a href='https://www.carpetright.co.uk/service/fitting/'>fitting arrangement service</a> and <a href='https://www.carpetright.co.uk/service/uplift-and-disposal/'>uplift and disposal arrangement service</a> so you know everything is handled.</p><br /><br /><h3>Expert Carpet Advice</h3><p>If you're looking to fit and lay a carpet yourself, we have a few guides that may be helpful. Such as <a href='https://www.carpetright.co.uk/advice/planning-guides/how-to-measure-a-room/'>how to measure a room</a> and <a href='https://www.carpetright.co.uk/carpets/how-to-fit-carpet/'>how to fit a carpet</a>. Once you have your new carpet, it's important to make sure you care for it and keep it clean, so it lasts. For more information, take a look at our <a href='https://www.carpetright.co.uk/carpets/carpet-care-guide/'>carpet care guide</a> for all the top tips on general cleaning, how to get rid of stains, and even how to clean by colour, type, material, and more.</p>",
              },
